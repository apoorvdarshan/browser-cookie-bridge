name: Publish release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dmg:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate release versions
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci --os=darwin --cpu="${{ matrix.arch }}"

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Require signing and notarization secrets
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_NAME }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for name in CERTIFICATE_P12 CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY ASC_PRIVATE_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done

      - name: Import Developer ID Application certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/browser-cookie-bridge.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CERTIFICATE_P12" | /usr/bin/base64 -D > "$CERTIFICATE"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"

      - name: Prepare App Store Connect notarization key
        env:
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_P8" | /usr/bin/base64 -D > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build self-contained DMG
        run: npm run build:dmg -- --arch "${{ matrix.arch }}"
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_NAME }}
          NOTARIZE: "1"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            dist/Browser-Cookie-Bridge-${{ matrix.arch }}.dmg
            dist/Browser-Cookie-Bridge-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error

  publish:
    name: Publish npm package and GitHub Release
    needs: build-dmg
    if: github.repository == 'apoorvdarshan/browser-cookie-bridge'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Validate release versions
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Pack npm artifact
        run: |
          package_file="$(npm pack --json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const parsed = JSON.parse(input); const item = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0]; process.stdout.write(item.filename); });')"
          echo "PACKAGE_FILE=$package_file" >> "$GITHUB_ENV"

      - name: Download DMG artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: dmg-*
          path: release-assets
          merge-multiple: true

      - name: Publish to npm
        run: npm publish "$PACKAGE_FILE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${PACKAGE_FILE}#npm package" \
            release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "Browser Cookie Bridge ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
