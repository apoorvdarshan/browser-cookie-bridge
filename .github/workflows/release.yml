name: Publish release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package and GitHub Release
    if: github.repository == 'apoorvdarshan/browser-cookie-bridge'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Validate release versions
        run: npm run release:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Pack npm artifact
        run: |
          package_file="$(npm pack --json | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input)[0].filename));')"
          echo "PACKAGE_FILE=$package_file" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: npm publish "$PACKAGE_FILE"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${PACKAGE_FILE}#npm package"
          --verify-tag
          --generate-notes
          --title "Browser Cookie Bridge ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
